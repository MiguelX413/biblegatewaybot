[project]
name = "biblegatewaybot"
version = "0.1.0"
description = "Telegram bot that fetches Bible passages from BibleGateway"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "python-scriptures>=3.0.0",
    "python-telegram-bot>=22.8,<23",
]

[project.scripts]
biblegatewaybot = "biblegatewaybot:main"

[tool.uv]
package = false
