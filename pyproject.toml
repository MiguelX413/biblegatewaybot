[project]
name = "scripturebot"
version = "0.1.0"
description = "Telegram bot that fetches Bible passages from BibleGateway"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4~=4.14.3",
    "httpx~=0.28.1",
    "lxml~=6.0.2",
    "python-scriptures~=3.0.0",
    "python-telegram-bot~=22.8",
]

[project.scripts]
scripturebot = "scripturebot:main"

[dependency-groups]
dev = [
    "black~=26.0",
    "mypy~=1.17",
]

[tool.uv]
package = false

[tool.black]
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
files = [
    "scripturebot.py",
    "bot.py",
    "handlers.py",
    "config.py",
    "state.py",
    "parsing.py",
    "versions.py",
    "services",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
