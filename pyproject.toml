[project]
name = "scripturebot"
version = "0.1.0"
description = "Telegram bot that fetches Bible passages from BibleGateway"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4~=4.15.0",
    "httpx~=0.28.1",
    "lxml~=6.1.1",
    "python-scriptures~=3.0.0",
    "python-telegram-bot~=22.8",
]

[project.scripts]
scripturebot = "scripturebot:main"

[dependency-groups]
dev = [
    "mypy~=2.3.0",
    "ruff~=0.15.22",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
files = [
    "scripturebot.py",
    "bot.py",
    "handlers.py",
    "config.py",
    "state.py",
    "parsing.py",
    "versions.py",
    "services",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
